name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $assembly = ($version -split '-')[0]
          } else {
            $version = "0.1.0-build.$env:GITHUB_RUN_NUMBER"
            $assembly = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "assembly=$assembly" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version (assembly $assembly)"

      - name: Restore
        run: dotnet restore src/ReDOS/ReDOS.csproj

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/ReDOS/ReDOS.csproj
          -c Release
          -r win-x64
          -o publish
          -p:Version=${{ steps.version.outputs.assembly }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Fetch DOS core (DOSBox-X)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api repos/joncampbell123/dosbox-x/releases/latest | ConvertFrom-Json

          $asset = $release.assets |
            Where-Object { $_.name -like '*.zip' -and $_.name -notmatch 'arm|macos|linux' } |
            Sort-Object -Property @{ Expression = {
                $n = $_.name.ToLower(); $score = 0
                if ($n -match 'win64|x64')      { $score += 10 }
                if ($n -match 'vsbuild|msvc')   { $score += 5 } elseif ($n -match 'mingw') { $score += 3 }
                if ($n -match 'win32|x86')      { $score -= 8 }
                if ($n -match 'lowend|xp')      { $score -= 6 }
                $score
            }} -Descending | Select-Object -First 1

          if (-not $asset) { throw 'No suitable DOSBox-X asset found in the latest release.' }
          Write-Host "Core asset: $($asset.name) ($($release.tag_name))"

          # Staged outside the workspace root so the download never lands in dist/.
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/core.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/core.zip" -DestinationPath "$env:RUNNER_TEMP/core-staging" -Force

          # Distribution zips carry several builds side by side; keep the 64-bit one.
          $exe = Get-ChildItem "$env:RUNNER_TEMP/core-staging" -Recurse -Filter dosbox-x.exe |
            Sort-Object -Property @{ Expression = {
                $p = $_.FullName.ToLower(); $score = 0
                if ($p -match 'x64|win64|64bit') { $score += 10 }
                if ($p -match 'x86|win32')       { $score -= 10 }
                if ($p -match 'debug')           { $score -= 5 }
                $score
            }}, Length -Descending | Select-Object -First 1

          if (-not $exe) { throw 'dosbox-x.exe was not found inside the archive.' }
          Write-Host "Using core build: $($exe.FullName)"

          New-Item -ItemType Directory -Force -Path publish/core | Out-Null
          Copy-Item -Path (Join-Path $exe.DirectoryName '*') -Destination publish/core -Recurse -Force
          "$($release.tag_name)" | Out-File -FilePath publish/core/CORE_VERSION.txt -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item README.md, LICENSE publish/ -Force
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $name = "ReDOS-${{ steps.version.outputs.version }}-win-x64"
          Compress-Archive -Path publish/* -DestinationPath "dist/$name.zip" -Force

          # Standalone exe for people who would rather let ReDOS fetch the core itself.
          Copy-Item publish/ReDOS.exe "dist/ReDOS-${{ steps.version.outputs.version }}-standalone.exe" -Force

          Get-FileHash dist/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File dist/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem dist | Select-Object Name, Length
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ReDOS-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ReDOS ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ReDOS latest (${{ steps.version.outputs.version }})
          prerelease: true
          body: |
            Automatic build of `main` (commit ${{ github.sha }}).

            - **ReDOS-*-win-x64.zip** — ReDOS plus the bundled DOS core. Unzip, run `ReDOS.exe` once, done.
            - **ReDOS-*-standalone.exe** — just ReDOS; downloads the core by itself on first use.
          files: dist/*
